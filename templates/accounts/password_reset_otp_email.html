<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Password reset OTP</title>
</head>
<body style="margin:0;padding:0;background:#f6f7fb;font-family:Arial,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f7fb;padding:28px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:#b30000;color:#ffffff;padding:22px 24px;">
              <h1 style="margin:0;font-size:22px;line-height:1.25;">Victoria University</h1>
              <p style="margin:6px 0 0;font-size:14px;">Internship Management System</p>
            </td>
          </tr>
          <tr>
            <td style="padding:26px 24px;">
              <p style="margin:0 0 14px;">Hello {{ user.display_name }},</p>
              <p style="margin:0 0 18px;line-height:1.55;">
                Use this OTP to reset your Victoria University Internship Portal password.
              </p>
              <p style="margin:0 0 18px;font-size:34px;font-weight:bold;letter-spacing:6px;color:#b30000;">
                {{ code }}
              </p>
              <p style="margin:0 0 18px;font-size:13px;color:#6b7280;line-height:1.5;">
                This code expires in {{ expires_minutes }} minutes.
              </p>
              <p style="margin:0;font-size:13px;color:#6b7280;line-height:1.5;">
                If you did not request this, you can ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
